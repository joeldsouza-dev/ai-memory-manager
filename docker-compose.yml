services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ai_memory_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_memory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
